[package]
name = "pocs"
version = "0.1.0"
edition = "2021"
description = "Rust port of deepteam red teaming attack templates — 22 single-turn + 5 multi-turn"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
rand = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenv = "0.15"
log = "0.4"
